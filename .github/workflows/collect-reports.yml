name: Collect smoke reports

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-reports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/collect.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit new reports
        run: |
          if git diff --quiet reports.json; then exit 0; fi
          git config user.name "nafas-bot"
          git config user.email "nafas-bot@users.noreply.github.com"
          git add reports.json
          git commit -m "Update smoke reports"
          git push
